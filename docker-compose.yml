services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: agroalerta
      POSTGRES_USER: agroalerta
      POSTGRES_PASSWORD: agroalerta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroalerta -d agroalerta"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agroalerta:agroalerta@db:5432/agroalerta
      CORS_ORIGINS: '["http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
